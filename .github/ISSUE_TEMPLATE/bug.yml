name: Report a bug
description: Report a problem someone else can try to reproduce.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Remove private information from logs and screenshots. If this is a
        vulnerability, use the private route in
        [Security](https://github.com/joaodriessen/moonwalk/blob/main/SECURITY.md).
  - type: textarea
    id: happened
    attributes:
      label: What went wrong?
      description: What did Moonwalk do? What should it have done? If it showed an error, include the wording.
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      placeholder: "1. Select a paired host.\n2. Click Connect.\n3. …"
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Moonwalk version
      description: Open About Moonwalk in the main menu.
    validations: {required: true}
  - type: input
    id: system
    attributes:
      label: Linux distribution, desktop, and GPU
      placeholder: Fedora, GNOME on Wayland, Intel Iris Xe
    validations: {required: true}
  - type: input
    id: host
    attributes:
      label: Host app, version, and OS
      placeholder: Sunshine 2025.924.154138 on Windows 11
    validations: {required: true}
  - type: dropdown
    id: network
    attributes:
      label: How are the computers connected?
      options: [Both wired, One wired and one on Wi-Fi, Both on Wi-Fi, Other or not sure]
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic summary
      description: After the problem happens, choose Copy Diagnostic Summary in the main menu. Review it for private details, then paste the relevant lines.
      render: text
