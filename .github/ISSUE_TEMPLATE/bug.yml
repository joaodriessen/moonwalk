name: Report a bug
description: Help us reproduce something that went wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Remove private information from logs and screenshots. If this is a
        vulnerability, use the private route in
        [Security](https://github.com/joaodriessen/moonwalk/blob/main/SECURITY.md).
  - type: textarea
    id: happened
    attributes:
      label: What went wrong?
      description: Tell us what you saw and what you expected. Include the error message if there was one.
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      placeholder: "1. Select a paired host.\n2. Click Connect.\n3. …"
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Moonwalk version
      description: Open About Moonwalk in the main menu.
    validations: {required: true}
  - type: input
    id: system
    attributes:
      label: Client distribution, desktop, and GPU
      placeholder: Fedora, GNOME Wayland, Intel integrated graphics
    validations: {required: true}
  - type: input
    id: host
    attributes:
      label: Host app, version, and OS
      placeholder: Sunshine on Windows 11
    validations: {required: true}
  - type: dropdown
    id: network
    attributes:
      label: How are the computers connected?
      options: [Both wired, One wired and one on Wi-Fi, Both on Wi-Fi, Other or not sure]
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic summary
      description: Choose Copy Diagnostic Summary in Moonwalk's main menu. Remove host names, addresses, and other private details before pasting.
      render: text
