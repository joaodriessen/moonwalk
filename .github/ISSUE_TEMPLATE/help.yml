name: Ask for help
description: Ask about installing, pairing, or using a stream.
labels: [help wanted]
body:
  - type: markdown
    attributes:
      value: >-
        See the [setup and troubleshooting guides](https://github.com/joaodriessen/moonwalk/blob/main/docs/guides/README.md).
        Remove private details from error messages and screenshots before sharing them.
  - type: dropdown
    id: step
    attributes:
      label: Where are you stuck?
      options: [Installing, Finding a host, Pairing, Connecting, During a stream, Updating or removing, Something else]
    validations: {required: true}
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what have you tried?
      description: Include any error message after removing private information.
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Moonwalk version
      description: Open About Moonwalk in the main menu if the app starts.
  - type: input
    id: system
    attributes:
      label: Client distribution and desktop
      placeholder: Fedora with GNOME
  - type: input
    id: host
    attributes:
      label: Host app and OS
      placeholder: Sunshine on Windows 11
