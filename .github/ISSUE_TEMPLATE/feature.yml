name: Suggest a change
description: Suggest something Moonwalk could make easier.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations: {required: true}
  - type: textarea
    id: today
    attributes:
      label: What's hard to do today?
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: Mention the host app or Linux desktop if it matters for your idea.
