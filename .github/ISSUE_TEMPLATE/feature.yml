name: Suggest a change
description: Describe something you want to do with Moonwalk.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations: {required: true}
  - type: textarea
    id: today
    attributes:
      label: Where does the current app get in the way?
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: If you have a host or desktop in mind, mention it.
